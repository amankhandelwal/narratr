line-length = 100
target-version = "py311"

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",   # Line too long
    "B904",   # Exception chaining (raise from)
    "SIM105", # Use contextlib.suppress
    "SIM108", # Use ternary operator
    "W191",   # Tab indentation (intentional, see format below)
    "E101",   # Mixed spaces and tabs (formatter handles this)
    "UP007",  # Use X | Y for union types (prefer Optional)
    "RUF001", # Ambiguous unicode
    "RUF003", # Ambiguous unicode in comments (en-dash, etc.)
]

[format]
quote-style = "double"
indent-style = "tab"
