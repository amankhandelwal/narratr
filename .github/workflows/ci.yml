name: CI

# ubuntu-latest cannot narrate — there is no MPS and no model weights — but it
# catches every regression that does not need them: lint, types, the Python
# suite, and the renderer's tsc and vitest. A macOS job would have to pull ~3.8
# GB of checkpoints for each run, so it is deliberately left out.
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Pinned exactly: setup-uv stopped publishing a floating major tag
        # after v7, so `@v10` does not resolve.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # Verified on 3.11.9; pyproject caps the project below 3.13.
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # torch is a hard dependency (narratr.device and friends import it, and
      # tests/test_device.py patches torch.mps), so the full ~1 GB Linux wheel
      # set gets installed. The uv cache above keeps that to the first run.
      - name: Install dependencies
        run: uv sync --frozen

      # `narratr validate` checks every icon name against the installed Lucide
      # pack, which is a real dependency of the gate rather than a renderer
      # detail -- so the spec tests need it too. Without it 14 tests fail on
      # "icons: pack not installed" and CI is testing a different thing from
      # the developer. Chromium is skipped: mermaid-cli pulls ~150 MB of it and
      # nothing in the Python suite shells out to mmdc.
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: render/remotion/package-lock.json

      - name: Install the icon pack
        run: npm ci
        working-directory: render/remotion
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy narratr/

      - name: Test
        run: uv run pytest tests/ -q

  renderer:
    name: Renderer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: render/remotion
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: render/remotion/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test
