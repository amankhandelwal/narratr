[mypy]
python_version = 3.11
warn_unused_configs = True
check_untyped_defs = True
disallow_untyped_defs = False
ignore_missing_imports = True
disable_error_code = no-any-return,var-annotated

[mypy-narratr.narrate]
# torch and chatterbox are imported lazily inside the function that needs
# them, so the model load cost is not paid by `narratr doctor`.
disable_error_code = attr-defined,import-untyped
